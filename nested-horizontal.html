<!DOCTYPE html>
<html>
  <head>
    <style>
      #top, #bottom {
        width: 100%;
        background: linear-gradient(green, yellow);
        height: 200vh;
      }
      #middle {
        width: 100%;
        height: 200px;
        overflow: scroll;
      }
      #middle-contents {
        width: 500vw;
        height: 100%;
        background: linear-gradient(45deg, blue, red);
      }
    </style>
  </head>
  <body>
    <div id="top"></div>
    <div id="middle">
      <div id="middle-contents"></div>
    </div>
    <div id="bottom"></div>
  </body>
</html>
