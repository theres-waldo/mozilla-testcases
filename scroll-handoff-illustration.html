<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustration of Scroll Handoff</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    /* Green box: stationary container */
    .green-box {
      position: relative;
      width: 200px;
      height: 400px;
      background: #2ecc40;
      border: 4px solid #1a8f2b;
      overflow: hidden;
    }

    /* Blue box: moves upward within the green box */
    .blue-box {
      position: absolute;
      left: 0;
      width: 200px;
      height: 100px;
      background: #0074d9;
      border: 4px solid #00509e;
      /* start near the bottom, animate once to the top */
      animation: move-up 2s ease-in-out forwards;
    }

    /* Red box: shorter than the blue box, aligned to the blue box's top.
       Being a child of the blue box, it moves in tandem with it. */
    .red-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 200px;
      height: 50px;
      background: #ff4136;
      border: 4px solid #c1281f;
      /* place the pushing finger at the bottom edge of the red box */
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 32px;
      line-height: 1;
    }

    @keyframes move-up {
      from { top: 300px; }  /* bottom of the green box (400 - 100) */
      to   { top: 0; }      /* top of the green box */
    }
  </style>
</head>
<body>
  <div class="green-box">
    <div class="blue-box">
      <div class="red-box">👆</div>
    </div>
  </div>
</body>
</html>
