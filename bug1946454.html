<!DOCTYPE html>
<meta name="viewport" content="width=device-width">
<style>
  html {
    touch-action: none;
  }
</style>
<div id="report"></div>
<script>
  let touches = [];
  function report() {
    document.getElementById("report").textContent = `Active touches: ${touches.length}`;
  }
  document.addEventListener("pointerdown", e => {
    touches.push(e);
    report();
  });
  document.addEventListener("pointermove", e => {
    touches = touches.map(t => t.pointerId !== e.pointerId ? t : e);
    report();
  });
  document.addEventListener("pointerup", e => {
    touches = touches.filter(t => t.pointerId !== e.pointerId);
    report();
  });
  document.addEventListener("pointercancel", e => {
    touches = touches.filter(t => t.pointerId !== e.pointerId);
    report();
  });

</script>
