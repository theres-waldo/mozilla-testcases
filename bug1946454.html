<!DOCTYPE html>
<meta name="viewport" content="width=device-width">
<style>
  html {
    touch-action: none;
    width: 100%;
    height: 100%;
  }
</style>
<div id="report"></div>
<script>
  let touches = [];
  let lastTouchLocation = null;
  function reportJump(magnitude) {
    report.innerHTML += `<br>JUMP by ${magnitude} pixels`;
  }
  function loc(touch) {
    return {
      x: touch.pageX,
      y: touch.pageY
    };
  }
  function panBy(oldLocation, newLocation) {
    let distance = Math.hypot(
      Math.abs(oldLocation.x - newLocation.x),
      Math.abs(oldLocation.x - newLocation.x));
    if (distance > 10) {
      reportJump(distance);
    }
  }
  document.addEventListener("pointerdown", e => {
    e.preventDefault();
    touches.push(e);

    // Reset lastTouchLocation when a new finger goes down.
    lastTouchLocation = null;
  });
  document.addEventListener("pointermove", e => {
    e.preventDefault();
    touches = touches.map(t => t.pointerId !== e.pointerId ? t : e);

    // If only one finger is down, pan them map by the amount it's moving.
    if (touches.length == 1) {
      let touchLocation = loc(touches[0]);
      if (lastTouchLocation != null) {
        panBy(lastTouchLocation, touchLocation);
      }
      lastTouchLocation = touchLocation;
    }
  });
  function pointerUpOrCancel(e) {
    e.preventDefault();
    touches = touches.filter(t => t.pointerId !== e.pointerId);

    // If two fingers were down and one was lifted, record the location
    // of the remaining touch as the "last touch location".
    if (touches.length == 1) {
      lastTouchLocation = loc(touches[0]);
    }
  }
  document.addEventListener("pointerup", pointerUpOrCancel);
  document.addEventListener("pointercancel", pointerUpOrCancel);

</script>
